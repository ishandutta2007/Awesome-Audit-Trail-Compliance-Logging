<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: url(#primaryGrad);
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      text-transform: uppercase;
      letter-spacing: 2.5px;
    }
    .code-text {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 11px;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #f1f5f9;
    }

    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(15px, -10px); opacity: 0.55; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(140px); opacity: 0; }
    }
    @keyframes pingDot {
      0% { r: 3px; opacity: 1; }
      100% { r: 9px; opacity: 0; }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .data-flow { stroke-dasharray: 8 6; animation: flowLine 3s linear infinite; }
    .scanner { animation: scanBeam 4s ease-in-out infinite; }
    .ping { animation: pingDot 2s cubic-bezier(0, 0, 0.2, 1) infinite; }
    .cursor { animation: blinkCursor 1s infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background) -->
  <circle class="orb-1" cx="220" cy="120" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="orb-2" cx="980" cy="280" r="160" fill="#818cf8" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="380" r="100" fill="#10b981" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Data Flow Connecting Lines (Middleground) -->
  <g stroke="#38bdf8" stroke-width="1.8" opacity="0.4" fill="none">
    <path class="data-flow" d="M 50 210 L 250 210 Q 300 210 320 250 L 350 310 Q 370 340 410 340 L 790 340" />
    <path class="data-flow" style="animation-duration: 4.5s;" d="M 1150 180 L 1000 180 Q 960 180 940 140 L 920 100 Q 900 70 860 70 L 600 70" />
  </g>

  <!-- Dynamic Animated Audit Block Card (Right Side / Background Accent) -->
  <g transform="translate(820, 85)">
    <!-- Outer Card Frame -->
    <rect width="330" height="230" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <rect width="330" height="36" rx="14" fill="#0f172a" opacity="0.8" />
    
    <!-- Window Dots -->
    <circle cx="20" cy="18" r="4.5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="4.5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="4.5" fill="#10b981" opacity="0.8" />
    <text x="80" y="22" class="code-text" fill="#64748b" font-weight="bold">AUDIT_VERIFY_CHAIN.LOG</text>

    <!-- Animated Scanning Light Beam -->
    <rect class="scanner" x="12" y="45" width="306" height="4" fill="url(#primaryGrad)" filter="url(#nodeGlow)" rx="2" />

    <!-- Code / Audit Stream Rows -->
    <g transform="translate(16, 62)">
      <!-- Line 1 -->
      <circle cx="6" cy="6" r="3" fill="#10b981" />
      <text x="18" y="10" class="code-text"><tspan fill="#38bdf8">EVENT</tspan>: AUTH_PRIVILEGE_ELEVATE</text>
      <text x="18" y="24" class="code-text" fill="#64748b">Hash: 8f4b2c… | Sig: WORM_LOCKED</text>

      <!-- Line 2 -->
      <circle cx="6" cy="46" r="3" fill="#10b981" />
      <text x="18" y="50" class="code-text"><tspan fill="#38bdf8">COMPLIANCE</tspan>: SOC2_CC6.8_PASSED</text>
      <text x="18" y="64" class="code-text" fill="#64748b">Chain: #104,291 -> Validated [OK]</text>

      <!-- Line 3 -->
      <circle cx="6" cy="86" r="3" fill="#38bdf8" />
      <circle class="ping" cx="6" cy="86" r="3" fill="#38bdf8" />
      <text x="18" y="90" class="code-text"><tspan fill="#818cf8">INGEST</tspan>: SIEM_FORWARD_BATCH</text>
      <text x="18" y="104" class="code-text" fill="#64748b">Rate: 14.8 GB/s | Tamper: 0%</text>

      <!-- Line 4 (Live Stream with Blinking Cursor) -->
      <rect x="0" y="118" width="298" height="24" rx="4" fill="#0f172a" />
      <text x="10" y="134" class="code-text" fill="#10b981">● LIVE MONITORING ACTIVE<tspan class="cursor" fill="#38bdf8"> _</tspan></text>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Pure text and branding (Never obscured) -->
  <g transform="translate(70, 75)">
    <!-- Sub-badge / Top Tagline -->
    <g transform="translate(0, 0)">
      <rect width="260" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#10b981" filter="url(#nodeGlow)" />
      <circle class="ping" cx="14" cy="13" r="4" fill="#10b981" />
      <text x="26" y="17" class="tagline-text">Curated Security &amp; Audit Trail</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="75" class="title-text">Awesome Audit Trail &amp;</text>
    <text x="0" y="130" class="title-text">Compliance Logging</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle-text">
      Enterprise SIEMs, tamper-evident audit logs, regulatory pipelines &amp; compliance tools
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 205)">
      <!-- Pill 1: SOC 2 & HIPAA -->
      <g transform="translate(0, 0)">
        <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" opacity="0.95" />
        <text x="67" y="20" class="pill-text" text-anchor="middle" fill="#60a5fa">🛡️ SOC 2 &amp; HIPAA</text>
      </g>
      <!-- Pill 2: Tamper-Evident -->
      <g transform="translate(145, 0)">
        <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" opacity="0.95" />
        <text x="72" y="20" class="pill-text" text-anchor="middle" fill="#a78bfa">🔒 Tamper-Evident</text>
      </g>
      <!-- Pill 3: Cloud SIEM -->
      <g transform="translate(300, 0)">
        <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" opacity="0.95" />
        <text x="65" y="20" class="pill-text" text-anchor="middle" fill="#22d3ee">⚡ Cloud SIEM</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(440, 0)">
        <rect width="135" height="32" rx="16" fill="#1e293b" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
        <text x="67" y="20" class="pill-text" text-anchor="middle" fill="#34d399">📦 Open Source</text>
      </g>
    </g>
  </g>
</svg>
